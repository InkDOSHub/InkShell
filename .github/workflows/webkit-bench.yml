name: WebKit benchmark
# Item 47 (measurement only): the committed engine.wasm in Chromium (V8) and WebKit (JavaScriptCore, the
# engine of Safari / the iPad) in the same run, same inputs: x86 cpubench, python3 x86 and WebAssembly start,
# JIT compile time. Light: no big files. Runs only when started by hand or when a PR touches these files.
# Item 48: HOTS (comma list) also sweeps the x86 JIT hot threshold (set_jit_hot) in both browsers.
# Item 52: REGIONS (comma list, blocks per JIT region, set_jit_region) makes the sweep HOTS x REGIONS.
# Item 59: STACKS (comma list, e.g. 1,0) = A/B of the JIT stack window (set_jit_stack), 2 alternated rounds.
# Item 60: FIBS (comma list region:chain) = steady fib(32) per JIT region size and chaining on/off, 2 rounds.
# A PR run does no HOT x region sweep and no STACKS A/B (only FIBS); start it by hand for those.
on:
  workflow_dispatch:
    inputs:
      hots: { description: 'JIT hot thresholds to sweep (empty = none)', default: '500,1000,2000' }
      regions: { description: 'JIT region sizes in blocks to sweep (empty = engine default)', default: '16,32,64' }
      stacks: { description: 'JIT A/B values for set_jit_<ab_fn> (empty = none)', default: '1,0' }
      ab_fn: { description: 'JIT switch for the A/B (stack = item 59, callret = item 66)', default: 'callret' }
      fibs: { description: 'steady fib per region:chain (item 60, empty = none)', default: '16:1,4:1,1:1,16:0' }
  pull_request:
    paths:
      - '.github/workflows/webkit-bench.yml'
      - 'tests/bench/browser*'
permissions:
  contents: read
concurrency:
  group: webkit-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inputs (cpubench, x86 python3, the catalog's python3 WebAssembly)
        run: |
          mkdir -p out
          timeout 300 docker run --rm -v "$PWD":/w -w /w alpine:3.21 sh -c '
            apk add -q gcc musl-dev &&
            gcc -O2 -static -o out/cpubench tests/src/cpubench.c &&
            gcc -O2 -static -o out/x86fib tests/src/x86fib.c &&
            mkdir /x && apk add -q --root /x --initdb --allow-untrusted --no-scripts \
              --repositories-file /etc/apk/repositories python3 &&
            tar -C /x -cf out/zpkgs.tar usr/bin usr/lib lib etc/ssl 2>/dev/null'
          cp tests/bench/browser.sh out/
          printf '/root/x86fib 10 36\necho "@@T done"\n' > out/fib.sh
          e=$(awk -F '\t' '$1 == "python3"' overlay/etc/inksoc/wasm-catalog)
          mkdir -p $RUNNER_TEMP/pw/usr/local/bin
          timeout 300 curl -fsSL --retry 3 -o $RUNNER_TEMP/pw/usr/local/bin/python3 "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  $RUNNER_TEMP/pw/usr/local/bin/python3" | sha256sum -c
          tar --format=ustar -C $RUNNER_TEMP/pw -cf out/zpywasm.tar usr
          ls -la out
      - name: Playwright (Chromium + WebKit)
        run: timeout 300 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium webkit'
      - name: Bench in both browsers
        env:
          HOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.hots || '' }}
          REGIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.regions || '16,32,64' }}
          STACKS: ${{ github.event_name == 'workflow_dispatch' && inputs.stacks || '' }}
          AB_FN: ${{ github.event_name == 'workflow_dispatch' && inputs.ab_fn || 'stack' }}
          FIBS: ${{ github.event_name == 'workflow_dispatch' && inputs.fibs || '16:1,4:1,1:1,16:0' }}
        run: timeout 1200 node tests/bench/browser.mjs
  boot:
    # Item 50 (measurement only): the real page boot to the prompt, Chromium vs WebKit (no big inputs).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright (Chromium + WebKit)
        run: timeout 300 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium webkit'
      - name: Boot to prompt, 3 runs per browser
        run: timeout 900 node tests/bench/browser-boot.mjs
