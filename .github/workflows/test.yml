name: Linux test
# Builds the engine from engine-src and runs tests/linux-test.mjs (boots Alpine, 20+ checks)
# against both the fresh build and the published engine.wasm.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASI test program (wasi-sdk)
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          $RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang -O2 -o tests/wasihello.wasm tests/src/wasihello.c
      - name: Build the engine
        run: |
          rustup target add wasm32-unknown-unknown
          cd engine-src && cargo build --release --target wasm32-unknown-unknown
      - name: Test the fresh build
        run: node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: Test the published engine.wasm
        run: node tests/linux-test.mjs engine.wasm
  page:
    # the real page in Chromium: WebAssembly programs in their own Worker through the service worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASI test program (wasi-sdk)
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          $RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang -O2 -o tests/wasihello.wasm tests/src/wasihello.c
      - name: Playwright (Chromium)
        run: |
          npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Page test (published engine.wasm)
        run: node tests/page-wasi.mjs tests/wasihello.wasm
