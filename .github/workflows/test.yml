name: Linux test
# Builds the engine from engine-src and runs tests/linux-test.mjs (boots Alpine, 20+ checks)
# against both the fresh build and the published engine.wasm.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASI test program (wasi-sdk)
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          $RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang -O2 -o tests/wasihello.wasm tests/src/wasihello.c
          $RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang -O2 -o tests/wasipwrite.wasm tests/src/wasipwrite.c
      - name: x86 test programs (Alpine gcc, static)
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3.21 sh -c '
            apk add -q gcc musl-dev openssl-dev && gcc -O2 -fno-tree-loop-distribute-patterns -static -o tests/x86string tests/src/x86string.c &&
            gcc -O2 -mbmi -mbmi2 -mpopcnt -mlzcnt -static -o tests/x86bmi tests/src/x86bmi.c &&
            gcc -O2 -static -o tests/x86pwrite tests/src/x86pwrite.c &&
            gcc -O2 -static -o tests/x86vfork tests/src/x86vfork.c &&
            gcc -O2 -static -o tests/x86sha tests/src/x86sha.c &&
            gcc -O2 -o tests/x86ssl tests/src/x86ssl.c -lcrypto &&
            gcc -O2 -fno-tree-vectorize -mssse3 -msse4.1 -msse4.2 -mcx16 -static -o tests/x86v2 tests/src/x86v2.c &&
            gcc -O2 -fno-tree-vectorize -maes -mpclmul -static -o tests/x86aes tests/src/x86aes.c &&
            echo "native (this runner):" && grep -m1 "model name" /proc/cpuinfo && (grep -qw sha_ni /proc/cpuinfo && echo sha_ni || echo "no sha_ni") &&
            tests/x86sha && tests/x86v2 && (grep -qw aes /proc/cpuinfo && tests/x86aes || echo "no aes") && tests/x86sha bench 512 && tests/x86ssl 1024 && OPENSSL_ia32cap=:~0x20000000 tests/x86ssl 1024'
      - name: python3 from the WebAssembly catalog (URL and sha256 from the catalog)
        run: |
          e=$(awk -F '\t' '$1 == "python3"' overlay/etc/inksoc/wasm-catalog)
          curl -fsSL --retry 3 -o tests/python.wasm "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  tests/python.wasm" | sha256sum -c
      - name: Pillow resize on this runner, native (item 84; compare with the WebAssembly python3 number in the Linux test)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 -m venv $RUNNER_TEMP/pil && $RUNNER_TEMP/pil/bin/pip install -q pillow==11.3.0
          $RUNNER_TEMP/pil/bin/python -c "import time; from PIL import Image; b = Image.new('RGB', (1024, 1024), (10, 20, 30)); t = time.time(); b.resize((512, 512), Image.LANCZOS); print('Pillow resize 1024x1024 -> 512x512 LANCZOS (native x86-64 runner):', int((time.time() - t) * 1000), 'ms')"
      - name: python3 start-up, wasm-tools-34 vs the catalog's (item 86, 1 run each, node)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 -o $RUNNER_TEMP/py34.wasm https://github.com/InkDOSHub/InkShell/releases/download/wasm-tools-34/python3.wasm
          timeout 120 node tests/py-start.mjs before=$RUNNER_TEMP/py34.wasm after=tests/python.wasm
      - name: pip wheel from the catalog (py3-pip, item 83) + six for a local index
        run: |
          e=$(awk -F '\t' '$1 == "py3-pip"' overlay/etc/inksoc/wasm-catalog)
          curl -fsSL --retry 3 -o tests/pip.whl "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  tests/pip.whl" | sha256sum -c
          curl -fsSL --retry 3 -o tests/six.whl https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
          echo "4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274  tests/six.whl" | sha256sum -c
      - name: 7-Zip, qpdf, ImageMagick, ffmpeg, sqlite, jq, lua, zip, unzip, ripgrep, hashtools, sed, find, awk, tar, gzip, xz, bzip2, zstd, bc, file, less, grep, vim, nano, curl, git, diffutils, patch, openssl from the WebAssembly catalog (URL and sha256 from the catalog)
        run: |
          for n in 7zip:7zz qpdf:qpdf imagemagick:magick ffmpeg:ffmpeg ffprobe:ffprobe sqlite:sqlite3 jq:jq lua5.4:lua zip:zip unzip:unzip ripgrep:rg hashtools:hashsum sed:sed findutils:find onetrue-awk:awk tar:bsdtar gzip:gzip xz:xz bzip2:bzip2 zstd:zstd bc:bc file:file less:less grep:grep vim:vim nano:nano curl:curl git:git diffutils:diff cmp:cmp patch:patch openssl:openssl; do
            e=$(awk -F '\t' -v n="${n%%:*}" '$1 == n' overlay/etc/inksoc/wasm-catalog); f=tests/${n#*:}.wasm
            curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
          done
      - name: uutils coreutils from the WebAssembly catalog (URL and sha256 from the catalog; skipped while the catalog has no entry)
        run: |
          e=$(awk -F '\t' '$1 == "coreutils"' overlay/etc/inksoc/wasm-catalog)
          if [ -n "$e" ]; then
            curl -fsSL --retry 3 -o tests/coreutils.wasm "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  tests/coreutils.wasm" | sha256sum -c
          fi
      - name: QuickJS-ng from the WebAssembly catalog (URL and sha256 from the catalog; skipped while the catalog has no entry) + small start/loop bench
        run: |
          e=$(awk -F '\t' '$1 == "quickjs"' overlay/etc/inksoc/wasm-catalog)
          if [ -n "$e" ]; then
            timeout 300 curl -fsSL --retry 3 -o tests/qjs.wasm "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  tests/qjs.wasm" | sha256sum -c
            timeout 120 node --no-warnings tests/bench/qjs-bench.mjs tests/qjs.wasm | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the engine
        run: |
          rustup target add wasm32-unknown-unknown
          cd engine-src && cargo build --release --target wasm32-unknown-unknown
      - name: python3 urllib http/https and curl https through the wisp tunnel (items 76, 82, real network; WASM program in a worker thread)
        timeout-minutes: 6
        run: INK_NET=1 INK_NET_PY=1 timeout 300 node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: pip install six in the WebAssembly python3 (item 83; apk add python3 brings py3-pip; PyPI through the wisp tunnel, local index if not)
        timeout-minutes: 6
        run: INK_NET=1 INK_PIP=1 timeout 300 node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: curl against busybox httpd on 127.0.0.1 (item 82; WebAssembly curl through the network helper, in a worker thread)
        timeout-minutes: 6
        run: INK_CURL=1 INK_WASI_THREADS=1 timeout 300 node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: python3 processes (item 78; subprocess/os.system through /dev/inksoc, WASM programs in worker threads)
        timeout-minutes: 6
        run: INK_SPAWN=1 INK_WASI_THREADS=1 timeout 300 node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: Test the fresh build
        run: node tests/linux-test.mjs engine-src/target/wasm32-unknown-unknown/release/inksoc.wasm
      - name: Test the published engine.wasm
        run: node tests/linux-test.mjs engine.wasm
  catalog:
    # WebAssembly catalog (apk add): every entry downloads with the listed sha256 and size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check overlay/etc/inksoc/wasm-catalog
        run: sh tools/check-wasm-catalog.sh
      - name: overlay.tar matches overlay/
        run: |
          mkdir -p $RUNNER_TEMP/a $RUNNER_TEMP/b
          tar -xf overlay.tar -C $RUNNER_TEMP/a && (cd overlay && cp -a etc usr $RUNNER_TEMP/b/)
          diff -r $RUNNER_TEMP/a $RUNNER_TEMP/b && echo "overlay.tar is up to date"
  page:
    # the real page in Chromium: WebAssembly programs in their own Worker through the service worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASI test program (wasi-sdk)
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          $RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang -O2 -o tests/wasihello.wasm tests/src/wasihello.c
      - name: Playwright (Chromium)
        run: |
          npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Engine from engine-src (the bot publishes engine.wasm later)
        run: |
          rustup target add wasm32-unknown-unknown
          cd engine-src && cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/inksoc.wasm ../engine.wasm
      - name: Page test
        run: node tests/page-wasi.mjs tests/wasihello.wasm
      - name: hashsum from the WebAssembly catalog (URL and sha256 from the catalog)
        run: |
          e=$(awk -F '\t' '$1 == "hashtools"' overlay/etc/inksoc/wasm-catalog); f=tests/hashsum.wasm
          curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
      - name: Page test without a service worker (sha256sum WASM on a 64 MB /mnt file)
        timeout-minutes: 8
        run: timeout 300 node tests/page-wasi-nosw.mjs tests/hashsum.wasm
