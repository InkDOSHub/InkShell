name: Terminal benchmark
# Performance of the Linux terminal (engine in node = same WebAssembly as the page) against the
# runner itself: CPU (tests/src/cpubench.c), Python (x86 and the catalog's WebAssembly build, column
# "wasm"), copy/sha256/zip/unzip of 64 MB and 1 GB, the catalog's WebAssembly zip/unzip/7zz on 1 GB,
# peak memory. Plus phase-2 pre-tests: WASI programs (probe, cpubench, CPython) in node.
# Results: the run's summary page; logs: the artifacts. Every PR (and every main push, which becomes
# the baseline) also shows the engine numbers side by side with the last successful main run.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'ROADMAP.md', 'LICENSE*']
  workflow_dispatch:
    inputs:
      big_mb: { description: 'Big file size (MB)', default: '1024' }
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BIG: ${{ inputs.big_mb || '1024' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Alpine 3.21 parts (cpubench, python3, zip, unzip)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD":/w -w /w alpine:3.21 sh -c '
            apk add -q gcc musl-dev &&
            gcc -O2 -static -o out/cpubench tests/src/cpubench.c &&
            mkdir /x && apk add -q --root /x --initdb --allow-untrusted --no-scripts \
              --repositories-file /etc/apk/repositories python3 zip unzip &&
            tar -C /x -cf out/zpkgs.tar usr/bin usr/lib lib etc/ssl 2>/dev/null; ls -la out'
          cp tests/bench/bench.sh tests/bench/pybench.py out/
      - name: python3 WebAssembly build (from the catalog), as /usr/local/bin/python3
        run: |
          e=$(awk -F '\t' '$1 == "python3"' overlay/etc/inksoc/wasm-catalog)
          mkdir -p $RUNNER_TEMP/pw/usr/local/bin
          curl -fsSL --retry 3 -o $RUNNER_TEMP/pw/usr/local/bin/python3 "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  $RUNNER_TEMP/pw/usr/local/bin/python3" | sha256sum -c
          tar --format=ustar -C $RUNNER_TEMP/pw -cf out/zpywasm.tar usr
      - name: Build the engine
        run: |
          rustup target add wasm32-unknown-unknown
          cd engine-src && cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/inksoc.wasm ../out/engine.wasm
      - name: Native (runner)
        run: |
          sudo apt-get install -y -qq zip unzip time >/dev/null || true
          python3 --version
          for s in "cpu" "py" "io 64" "io $BIG"; do
            n=$(echo $s | tr ' ' -)
            BENCH_STAMP=1 BENCH_DIR=$RUNNER_TEMP/b /usr/bin/time -v -o out/native-$n.time sh out/bench.sh $s 2>&1 | node tests/bench/stamp.mjs | tee out/native-$n.log
          done
      - name: Engine
        run: |
          E="node tests/bench-engine.mjs out/engine.wasm cpubench=out/cpubench bench.sh=out/bench.sh pybench.py=out/pybench.py zpkgs.tar=out/zpkgs.tar --"
          for s in "cpu" "py" "io 64" "io $BIG"; do
            n=$(echo $s | tr ' ' -)
            echo "::group::engine $s"
            /usr/bin/time -v -o out/engine-$n.time timeout 1800 $E sh /root/bench.sh $s 2>&1 | tee out/engine-$n.log
            grep -q '@@T done' out/engine-$n.log || echo "- motor \`$s\`: não terminou (ver engine-$n.log)" | tee -a out/engine-fails.txt
            echo "::endgroup::"
          done
      - name: Engine, python3 via WASI (the catalog's python.wasm run by the kernel)
        run: |
          echo "::group::engine py (WebAssembly)"
          /usr/bin/time -v -o out/wasm-py.time timeout 1800 node tests/bench-engine.mjs out/engine.wasm bench.sh=out/bench.sh pybench.py=out/pybench.py zpywasm.tar=out/zpywasm.tar -- sh /root/bench.sh py 2>&1 | tee out/wasm-py.log
          grep -q '@@T done' out/wasm-py.log || echo "- motor \`py\` (WebAssembly): não terminou (ver wasm-py.log)" | tee -a out/engine-fails.txt
          echo "::endgroup::"
      - name: Big file through the catalog's WebAssembly zip, unzip, 7zz (item 30; measurement only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p $RUNNER_TEMP/wt/usr/local/bin
          for n in zip:zip unzip:unzip 7zip:7zz; do
            e=$(awk -F '\t' -v n="${n%%:*}" '$1 == n' overlay/etc/inksoc/wasm-catalog); f=$RUNNER_TEMP/wt/usr/local/bin/${n#*:}
            curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c; chmod 755 "$f"
          done
          tar --format=ustar -C $RUNNER_TEMP/wt -cf out/zwasmtools.tar usr
          sudo apt-get install -y -qq zip unzip time 7zip >/dev/null || true
          SZ=$(command -v 7zz || command -v 7z || echo 7zz); $SZ 2>&1 | head -3 || true
          BENCH_STAMP=1 BENCH_RSS=1 SZ=$SZ BENCH_DIR=$RUNNER_TEMP/bw sh out/bench.sh wasmio $BIG 2>&1 | node tests/bench/stamp.mjs | tee out/native-wasmio.txt
          rm -rf $RUNNER_TEMP/bw
          INKSOC_WASI_PROFILE=1 WASI_PROFILE_JSON=out/wasiprof-big.json /usr/bin/time -v -o out/engine-wasmio.time timeout 2400 \
            node tests/bench-engine.mjs out/engine.wasm bench.sh=out/bench.sh zwasmtools.tar=out/zwasmtools.tar -- sh /root/bench.sh wasmio $BIG > out/engine-wasmio.txt 2>&1 || true
          cut -f2- out/engine-wasmio.txt | tail -30
          { echo "## Ferramentas WASM do catálogo em arquivo de $BIG MB (tempo + pico de memória)"; echo; node tests/bench/bigwasm.mjs out/wasiprof-big.json out/engine-wasmio.txt out/native-wasmio.txt;
            echo "Pico RSS do node no run inteiro: $(awk '/Maximum resident/ {printf "%.0f MB", $NF/1024}' out/engine-wasmio.time)"; } > out/bigwasm.md
          cat out/bigwasm.md | tee -a $GITHUB_STEP_SUMMARY
      - name: Syscall audit (x86 python3, git, sqlite3, bash, coreutils, tar/xz from Alpine; measurement only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3.21 sh -c '
            mkdir /x && apk add -q --root /x --initdb --allow-untrusted --no-scripts \
              --repositories-file /etc/apk/repositories python3 git sqlite xz bash coreutils findutils grep tar gzip &&
            tar -C /x -cf out/zaudit.tar usr/bin usr/lib usr/libexec usr/share/git-core lib bin etc/ssl 2>/dev/null; ls -la out/zaudit.tar'
          timeout 1500 node tests/bench-engine.mjs out/engine.wasm audit.sh=tests/bench/audit.sh zaudit.tar=out/zaudit.tar -- sh /root/audit.sh > out/audit.log 2>&1 || true
          { echo "## Auditoria de syscalls (ENOSYS por programa x86)"; echo; echo '```'; cut -f2 out/audit.log | grep -E '^@@(A|ENOSYS|ERR)|ok$|-done$|^py |^bash |^wal' ; echo '```'; } > out/audit.md
          cat out/audit.md | tee -a $GITHUB_STEP_SUMMARY
      - name: sqlite3 x86 in WAL mode (item 28)
        if: ${{ !cancelled() }}
        run: cut -f2 out/audit.log | grep -E '^wal|sqlite-wal|rror' ; grep -q sqlite-wal-ok out/audit.log
      - name: WASI profile of the python3 start (INKSOC_WASI_PROFILE=1; measurement only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          BENCH_STAMP=1 BENCH_DIR=$RUNNER_TEMP/b sh out/bench.sh pystart 2>&1 | node tests/bench/stamp.mjs > out/native-pystart.txt || true
          INKSOC_WASI_PROFILE=1 WASI_PROFILE_JSON=out/wasiprof.json timeout 900 node tests/bench-engine.mjs out/engine.wasm bench.sh=out/bench.sh zpywasm.tar=out/zpywasm.tar -- sh /root/bench.sh pystart > out/wasi-pystart.txt 2>&1 || true
          { echo "## Perfil da abertura do python3 WASM"; echo; node tests/bench/wasiprof.mjs out/wasiprof.json out/wasi-pystart.txt out/native-pystart.txt; } > out/wasiprof.md
          cat out/wasiprof.md | tee -a $GITHUB_STEP_SUMMARY
      - name: Profile (engine built with --features ophist; measurement only, not published)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          cd engine-src && cargo build --release --target wasm32-unknown-unknown --features ophist
          cp target/wasm32-unknown-unknown/release/inksoc.wasm ../out/engine-ophist.wasm && cd ..
          PROFILE_JSON=out/profile.json timeout 1800 node tests/bench-engine.mjs out/engine-ophist.wasm cpubench=out/cpubench bench.sh=out/bench.sh -- sh /root/bench.sh cpu io 16 > out/profile-cpu.log 2>&1 || true
          { echo "## Perfil x86 do cpubench + sha256sum 16 MB (JIT vs interpretador)"; echo; node tests/bench/profile.mjs out/profile.json; } > out/profile.md
          cat out/profile.md | tee -a $GITHUB_STEP_SUMMARY
      - name: Report
        if: always()
        run: |
          cd out
          node ../tests/bench/report.mjs \
            native=$(ls native-*.log | paste -sd,) engine=$(ls engine-*.log | paste -sd,) wasm=wasm-py.log \
            native.time=$(ls native-*.time | paste -sd,) wasm.time=wasm-py.time > report.md || true
          { echo "## Terminal: motor vs nativo (runner)"; echo; cat report.md; echo; cat engine-fails.txt 2>/dev/null; echo; echo "ENOSYS (contador do motor):"; grep -h '@@ENOSYS' engine-*.log wasm-py.log 2>/dev/null | sed 's/^/- /'; } | tee -a $GITHUB_STEP_SUMMARY
      - name: Compare with previous main run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w bench.yml -b main -s success -L 5 --json databaseId,headSha \
            -q "[.[] | select(.headSha != \"$GITHUB_SHA\")][0].databaseId" || true)
          [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n bench-engine -D prev || echo "no previous run"
          { echo "## Motor: antes (main, run ${id:-—}) vs agora"; echo; node ../tests/bench/compare.mjs prev/results.json results.json; } > compare.md
          cat compare.md | tee -a $GITHUB_STEP_SUMMARY
      - name: PR comment (side by side)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd out
          { echo '<!-- bench-compare -->'; cat compare.md; echo; echo '<details><summary>Motor vs nativo</summary>'; echo; cat report.md; echo; echo '</details>'; echo; echo '<details><summary>Perfil x86 (cpubench)</summary>'; echo; cat profile.md 2>/dev/null; echo; echo '</details>'; echo; echo '<details><summary>Perfil abertura python3 WASM</summary>'; echo; cat wasiprof.md 2>/dev/null; echo; echo '</details>'; echo; echo '<details><summary>Ferramentas WASM em arquivo grande</summary>'; echo; cat bigwasm.md 2>/dev/null; echo; echo '</details>'; } > body.md
          cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- bench-compare -->")) | .id' | tail -1)
          if [ -n "$cid" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@body.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-engine
          path: |
            out/*.log
            out/*.time
            out/*.md
            out/*.json
            out/*.txt
  wasi:
    # phase 2 pre-test: what running WASI programs directly (no x86 emulation) would give
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: wasi-sdk
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          echo "CC=$RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux/bin/clang" >> $GITHUB_ENV
      - name: Build probe and cpubench (WASI)
        run: |
          mkdir -p out
          $CC -O2 -o out/probe.wasm tests/bench/wasi/probe.c
          $CC -O2 -o out/cpubench.wasm tests/src/cpubench.c
          gcc -O2 -static -o out/cpubench tests/src/cpubench.c
          ls -la out
      - name: Probe (WASI calls a tool needs)
        run: |
          mkdir -p $RUNNER_TEMP/w
          echo hello | WASI_DIR=$RUNNER_TEMP/w node tests/bench/wasi/run.mjs out/probe.wasm arg1 2> out/probe.err | tee out/probe.log
          cat out/probe.err
      - name: cpubench native vs WASI
        run: |
          out/cpubench | node tests/bench/stamp.mjs | tee out/native-cpu.log
          node tests/bench/wasi/run.mjs out/cpubench.wasm 2> out/wasi-cpu.err | node tests/bench/stamp.mjs | tee out/wasi-cpu.log
          grep @@MEM out/wasi-cpu.err >> out/wasi-cpu.log; cat out/wasi-cpu.err
      - name: CPython WASI (prebuilt, VMware Labs)
        continue-on-error: true
        run: |
          curl -fsSL -o out/python.wasm 'https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0.wasm'
          ls -la out/python.wasm
          mkdir -p $RUNNER_TEMP/p && cp tests/bench/pybench.py $RUNNER_TEMP/p/
          (echo '@@T begin:py-start'; WASI_DIR=$RUNNER_TEMP/p node tests/bench/wasi/run.mjs out/python.wasm -c pass; echo '@@T end:py-start'; \
           echo '@@T begin:py-bench'; WASI_DIR=$RUNNER_TEMP/p node tests/bench/wasi/run.mjs out/python.wasm /w/pybench.py; echo '@@T end:py-bench') \
            2> out/wasi-py.err | node tests/bench/stamp.mjs | tee out/wasi-py.log
          grep @@MEM out/wasi-py.err >> out/wasi-py.log; cat out/wasi-py.err
          (cd out && cp ../tests/bench/pybench.py . && BENCH_STAMP=1 sh ../tests/bench/bench.sh py) | node tests/bench/stamp.mjs | tee out/native-py.log
      - name: Report
        if: always()
        run: |
          cd out
          node ../tests/bench/report.mjs native=native-cpu.log,native-py.log wasi=wasi-cpu.log,wasi-py.log > report.md || true
          { echo "## Fase 2 (pré-teste): WASI direto em node vs nativo"; echo; cat report.md; echo; echo '**Probe WASI**'; echo '```'; cat probe.log; grep -h @@IMPORTS probe.err wasi-py.err 2>/dev/null | cut -c1-1500; echo '```'; } | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-wasi
          path: |
            out/*.log
            out/*.err
            out/*.md
            out/*.json
