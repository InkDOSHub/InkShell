name: Diffutils bench
# Item 71 (proof of gain): busybox x86 (JIT) vs WebAssembly diff/cmp (uutils diffutils), same run, in Chromium (V8) and
# WebKit (JavaScriptCore, the iPad's engine): diff / diff -u of two 10 MB texts, diff -r of 2000 files, cmp of 64 MB,
# start cold and warm. Runs when started by hand or when a PR touches these files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/diffutils-bench.yml'
      - 'tests/bench/browser-diffutils*'
      - 'overlay/etc/inksoc/wasm-catalog'
permissions:
  contents: read
concurrency:
  group: diffutils-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The catalog's diffutils (sha256 checked) at /usr/local/bin
        run: |
          mkdir -p out/tools $RUNNER_TEMP/pw/usr/local/bin
          for pair in diffutils:diffutils; do
            pkg=${pair%%:*}; n=${pair##*:}
            e=$(awk -F '\t' -v p="$pkg" '$1 == p' overlay/etc/inksoc/wasm-catalog); f=out/tools/$n
            [ -n "$e" ] || { echo "no catalog entry $pkg"; exit 1; }
            timeout 300 curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
            for l in $(printf '%s' "$e" | cut -f6 | tr ',' ' '); do
              install -m 755 "$f" "$RUNNER_TEMP/pw$l"
            done
          done
          tar --format=ustar -C $RUNNER_TEMP/pw -cf out/ztools.tar usr
          cp tests/bench/browser-diffutils.sh out/
          ls -la out out/tools; tar tvf out/ztools.tar
      - name: Playwright (Chromium + WebKit)
        run: timeout 900 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium webkit'
      - name: busybox vs WebAssembly in both browsers
        run: timeout 2400 node tests/bench/browser-diffutils.mjs
