name: WebAssembly tools
# Builds the catalog's WebAssembly (WASI) tools from upstream sources (tools/wasm-tools/build.sh, wasi-sdk-33:
# C++ exceptions) and publishes them as the GitHub release $TAG of this repo, with the sources (LGPL).
# The catalog (overlay/etc/inksoc/wasm-catalog) points at the release; a published release is never replaced:
# change TAG to publish a new build (then update the catalog's sha256/size). The tools of the previous release
# ($PREV) are copied into the new one unchanged (a tool whose build failed).
on:
  push:
    branches: ['claude/**']
    paths: ['tools/wasm-tools/**', '.github/workflows/wasm-tools.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: wasm-tools-8
  PREV: wasm-tools-7
concurrency:
  group: wasm-tools-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: [coreutils] # wasm-tools-8: uutils coreutils (item 56); the other tools are copied from $PREV
    steps:
      - uses: actions/checkout@v4
      - name: Already published?
        id: rel
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # a draft left by a release step that failed half way (GitHub 504) is not "published": delete it
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[]|select(.draft and (.tag_name==\"$TAG\" or .name==\"WebAssembly tools ($TAG)\"))|.id"); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release view "$TAG" >/dev/null 2>&1 && echo "done=1" >> "$GITHUB_OUTPUT" || true
      - name: wasi-sdk-33
        if: steps.rel.outputs.done != '1'
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          sudo apt-get install -y -qq ninja-build >/dev/null
      - name: Build ${{ matrix.tool }}
        if: steps.rel.outputs.done != '1'
        run: |
          WASI_SDK=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux WORK=$RUNNER_TEMP/work OUT=$PWD/out sh tools/wasm-tools/build.sh ${{ matrix.tool }}
          cd out && sha256sum *.wasm && wc -c *.wasm
      - uses: actions/setup-node@v4
        if: steps.rel.outputs.done != '1'
        with: { node-version: 22 }
      - name: wasi-libc cwd pointer (wasi.js cwdSlot)
        if: steps.rel.outputs.done != '1'
        continue-on-error: true
        run: |
          for f in out/*.wasm; do node --input-type=module -e "import fs from 'node:fs'; import { cwdSlot } from '$PWD/wasi.js'; const s = cwdSlot(fs.readFileSync('$f')); console.log('$f', s ? 'cwd pointer at ' + s.ptr : 'NO cwd pointer')"; done
      - uses: actions/upload-artifact@v4
        if: steps.rel.outputs.done != '1'
        with:
          name: ${{ matrix.tool }}
          path: out/*
  release:
    needs: build
    if: ${{ !cancelled() }} # a tool whose build failed is copied from $PREV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release ${{ env.TAG }} (once)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[]|select(.draft and (.tag_name==\"$TAG\" or .name==\"WebAssembly tools ($TAG)\"))|.id"); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already published"; gh release view "$TAG"; exit 0; fi
          gh release download "$PREV" -D out --skip-existing && rm -f out/SHA256SUMS
          cd out && ls -l && sha256sum * > SHA256SUMS
          gh release create "$TAG" --target "$GITHUB_SHA" --title "WebAssembly tools ($TAG)" --notes "WASI (wasm32-wasip1) builds for the InkShell catalog (apk add), made by .github/workflows/wasm-tools.yml from tools/wasm-tools/build.sh at $GITHUB_SHA. No GPL code: ffmpeg is LGPL-2.1+ (no --enable-gpl, no external libraries), 7-Zip LGPL-2.1+/BSD-3-Clause without unRAR, qpdf Apache-2.0, ImageMagick under the ImageMagick license (with libpng, libjpeg-turbo, zlib), SQLite public domain, jq MIT, Lua MIT, Info-ZIP zip/unzip under the Info-ZIP license (unzip with the Debian 6.0-28 security patches, src-unzip-6.0-debian-patches.tar.gz), ripgrep MIT/Unlicense, hashsum (md5sum, sha*sum, b2sum; InkShell's own code) MIT, uutils coreutils 0.8.0 (multicall: ls, cat, cp, sort, wc...) MIT with MIT/Apache-2.0/Unicode dependencies (the crate that offers GPL-2.0 as an alternative is used under Apache-2.0). Only coreutils is built in $TAG; the other tools are copied from $PREV unchanged. Every tool is linked with the wasi-libc working-directory support (chdir/getcwd: relative paths follow the shell folder); a tool whose build failed is copied from $PREV. The src-*.tar.gz files are the exact sources used." *
