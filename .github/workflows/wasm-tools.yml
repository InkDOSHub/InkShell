name: WebAssembly tools
# Builds the catalog's WebAssembly (WASI) tools from upstream sources (tools/wasm-tools/build.sh, wasi-sdk-33:
# C++ exceptions) and publishes them as the GitHub release $TAG of this repo, with the sources (LGPL).
# The catalog (overlay/etc/inksoc/wasm-catalog) points at the release; a published release is never replaced:
# change TAG to publish a new build (then update the catalog's sha256/size). The tools of the previous release
# ($PREV) are copied into the new one unchanged (a tool whose build failed).
on:
  push:
    branches: ['claude/**']
    paths: ['tools/wasm-tools/**', '.github/workflows/wasm-tools.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: wasm-tools-25
  PREV: "" # wasm-tools-25 holds only nano (item 81): no copy from an earlier release
concurrency:
  group: wasm-tools-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: [nano] # wasm-tools-25: GNU nano 8.3 over ncurses 6.5 (item 81, nano GPL-3.0-or-later, a separate catalog program; both source tarballs go in the release), published alone; -24: Vim 9.1.1400 (item 74, Vim license, a separate catalog program; the source release goes in the release; -21 was an earlier vim build with other host imports, not used), published alone; -23: GNU grep 3.12 (item 80, GPL-3.0-or-later, a separate catalog program; the source release goes in the release), published alone; -22: qjs std.popen/os.exec (item 79: host channel /dev/inksoc, tools/wasm-tools/patches/quickjs/exec-wasi.patch), published alone; -20 (-19: same, before the shell-builtin fix): awk system()/pipes, lua os.execute/io.popen, find -exec/-ok (item 78: host channel /dev/inksoc), published alone; -18: less (item 73); -17: bc, file; earlier tools stay in their own releases (-15: bzip2, zstd; -14: xz, tar, gzip; -13: find; -12: awk; -11: sed)
    steps:
      - uses: actions/checkout@v4
      - name: Already published?
        id: rel
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && echo "done=1" >> "$GITHUB_OUTPUT" || true
      - name: wasi-sdk-33
        if: steps.rel.outputs.done != '1'
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar -xz -C $RUNNER_TEMP
          sudo apt-get install -y -qq ninja-build bison ncurses-bin ncurses-base >/dev/null
      - name: Build ${{ matrix.tool }}
        if: steps.rel.outputs.done != '1'
        run: |
          WASI_SDK=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux WORK=$RUNNER_TEMP/work OUT=$PWD/out sh tools/wasm-tools/build.sh ${{ matrix.tool }}
          cd out && sha256sum *.wasm && wc -c *.wasm
      - uses: actions/setup-node@v4
        if: steps.rel.outputs.done != '1'
        with: { node-version: 22 }
      - name: wasi-libc cwd pointer (wasi.js cwdSlot)
        if: steps.rel.outputs.done != '1'
        continue-on-error: true
        run: |
          for f in out/*.wasm; do node --input-type=module -e "import fs from 'node:fs'; import { cwdSlot } from '$PWD/wasi.js'; const s = cwdSlot(fs.readFileSync('$f')); console.log('$f', s ? 'cwd pointer at ' + s.ptr : 'NO cwd pointer')"; done
      - uses: actions/upload-artifact@v4
        if: steps.rel.outputs.done != '1'
        with:
          name: ${{ matrix.tool }}
          path: out/*
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release ${{ env.TAG }} (once)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already published"; gh release view "$TAG"; exit 0; fi
          if [ -n "$PREV" ]; then gh release download "$PREV" -D out --skip-existing && rm -f out/SHA256SUMS; fi
          cd out && ls -l && sha256sum * > SHA256SUMS
          gh release create "$TAG" --target "$GITHUB_SHA" --title "WebAssembly tools ($TAG)" --notes "WASI (wasm32-wasip1) builds for the InkShell catalog (apk add), made by .github/workflows/wasm-tools.yml from tools/wasm-tools/build.sh at $GITHUB_SHA. No GPL code except grep (a separate program, see below): ffmpeg is LGPL-2.1+ (no --enable-gpl, no external libraries), 7-Zip LGPL-2.1+/BSD-3-Clause without unRAR, qpdf Apache-2.0, ImageMagick under the ImageMagick license (with libpng, libjpeg-turbo, zlib), SQLite public domain, jq MIT, Lua MIT, Info-ZIP zip/unzip under the Info-ZIP license (unzip with the Debian 6.0-28 security patches, src-unzip-6.0-debian-patches.tar.gz), ripgrep MIT/Unlicense, hashsum (md5sum, sha*sum, b2sum; InkShell's own code) MIT, uutils coreutils 0.8.0 (multicall: ls, cat, cp, sort, wc...) MIT with MIT/Apache-2.0/Unicode dependencies (the crate that offers GPL-2.0 as an alternative is used under Apache-2.0), QuickJS-ng (qjs) MIT, uutils sed 0.3.0 MIT, uutils findutils 0.9.1 (find) MIT with oniguruma BSD-2-Clause, one-true-awk (Bell Labs, MIT-style license), xz 5.8.1 (0BSD; liblzma 0BSD), libarchive 3.8.1 bsdtar (BSD-2-Clause and BSD-3-Clause, with zlib and liblzma; the InkShell WASI patch is tools/wasm-tools/patches/libarchive/wasi.patch), gzip (InkShell's own code over zlib, MIT and zlib license), bzip2 1.0.8 (bzip2 license, BSD-style), zstd 1.5.7 (BSD-3-Clause), Gavin Howard bc 7.0.3 (BSD-2-Clause, bc and dc), file 5.46 with libmagic (BSD-2-Clause). Only vim (Vim 9.1.1400, Vim license: charityware, GPL-compatible; normal features, no GUI/X11/scripting languages, builtin terminal entries, the InkShell changes are tools/wasm-tools/vim and the sed edits in b_vim of tools/wasm-tools/build.sh; src-vim-v9.1.1400.tar.gz is the upstream source) is in wasm-tools-24. nano (GNU nano 8.3, GPL-3.0-or-later, a separate catalog program, over ncurses 6.5 under the X11-style ncurses license; src-nano-8.3.tar.xz and src-ncurses-6.5.tar.gz are the exact upstream source releases, the InkShell changes are in b_nano and tools/wasm-tools/nano/ of this repository) is in $TAG. Earlier: grep (GNU grep 3.12, GPL-3.0-or-later, a separate catalog program: src-grep-3.12.tar.xz is the exact upstream source release, the InkShell changes are the sed edits in b_grep of tools/wasm-tools/build.sh) is in wasm-tools-23. Earlier: qjs (rebuilt with processes through the host channel /dev/inksoc: std.popen and os.exec, tools/wasm-tools/patches/quickjs/exec-wasi.patch) is in wasm-tools-22; every other tool stays in its own release (see wasm-tools-10 to -22). Every tool is linked with the wasi-libc working-directory support (chdir/getcwd: relative paths follow the shell folder). The src-*.tar.gz files are the exact sources used." *
