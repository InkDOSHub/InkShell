name: bc bench
# Item 72 (proof of gain, Chromium only): busybox x86 (JIT) bc/dc vs the catalog's WebAssembly bc/dc (Gavin Howard's bc),
# same run: 2^100000, sqrt(2) to 2000 digits, dc 2^100000, start cold and warm. file has no busybox twin: it is checked in test.yml.
# Runs when started by hand or when a PR touches these files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bc-bench.yml'
      - 'tests/bench/browser-bc*'
permissions:
  contents: read
concurrency:
  group: bc-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The catalog's bc (sha256 checked) at /usr/local/bin as bc and dc
        run: |
          mkdir -p out/tools $RUNNER_TEMP/pw/usr/local/bin
          e=$(awk -F '\t' '$1 == "bc"' overlay/etc/inksoc/wasm-catalog); f=out/tools/bc
          [ -n "$e" ] || { echo "no catalog entry bc"; exit 1; }
          timeout 300 curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
          for l in $(printf '%s' "$e" | cut -f6 | tr ',' ' '); do install -m 755 "$f" "$RUNNER_TEMP/pw$l"; done
          tar --format=ustar -C $RUNNER_TEMP/pw -cf out/ztools.tar usr
          cp tests/bench/browser-bc.sh out/
          ls -la out out/tools; tar tvf out/ztools.tar
      - name: Playwright (Chromium)
        run: timeout 900 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium'
      - name: busybox vs WebAssembly in Chromium
        run: timeout 1200 node tests/bench/browser-bc.mjs
