name: diff bench
# Item 71 (Chromium only): busybox x86 (JIT) diff/cmp vs the catalog's WebAssembly GNU diffutils,
# same run: diff, diff -u and cmp on ~10 MB files (one rep); the other checks are in test.yml.
# Runs when started by hand or when a PR touches these files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/diff-bench.yml'
      - 'tests/bench/browser-diff*'
permissions:
  contents: read
concurrency:
  group: diff-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The catalog's diff and cmp (sha256 checked) at /usr/local/bin
        run: |
          mkdir -p out/tools $RUNNER_TEMP/pw/usr/local/bin
          for n in diffutils:diff cmp:cmp; do
            e=$(awk -F '\t' -v n="${n%%:*}" '$1 == n' overlay/etc/inksoc/wasm-catalog); f=out/tools/${n#*:}
            [ -n "$e" ] || { echo "no catalog entry ${n%%:*}"; exit 1; }
            timeout 300 curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
            echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
            for l in $(printf '%s' "$e" | cut -f6 | tr ',' ' '); do install -m 755 "$f" "$RUNNER_TEMP/pw$l"; done
          done
          tar --format=ustar -C $RUNNER_TEMP/pw -cf out/ztools.tar usr
          cp tests/bench/browser-diff.sh out/
          ls -la out out/tools; tar tvf out/ztools.tar
      - name: Playwright (Chromium)
        run: timeout 900 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium'
      - name: busybox vs WebAssembly in Chromium
        run: timeout 1200 node tests/bench/browser-diff.mjs
