name: Big file in /mnt (WebKit)
# Item 61 (measurement only): a ~10 GB sparse file mounted at /mnt in the real page (index.html), WebKit (iPad engine)
# and Chromium (reference): wc -c, dd in the middle, sha256sum of a slice, WebAssembly sha256sum of 1 GB and of the
# whole file. RSS of the browser processes sampled every 1 s. Heavy: runs only by hand or when a PR touches these files.
on:
  workflow_dispatch:
    inputs:
      full_budget_s: { description: 'seconds the whole-file WebAssembly sha256sum may take', default: '600' }
  pull_request:
    paths:
      - '.github/workflows/big-mnt.yml'
      - 'tests/bench/big-mnt.mjs'
permissions:
  contents: read
concurrency:
  group: big-mnt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  big:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: webkit, sw: block }
          - { browser: chromium, sw: block }
          - { browser: webkit, sw: allow }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: timeout 300 sh -c 'npm i -s --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium webkit'
      - name: hashsum from the WebAssembly catalog
        run: |
          e=$(awk -F '\t' '$1 == "hashtools"' overlay/etc/inksoc/wasm-catalog); f=tests/hashsum.wasm
          timeout 120 curl -fsSL --retry 3 -o "$f" "$(printf '%s' "$e" | cut -f2)"
          echo "$(printf '%s' "$e" | cut -f3)  $f" | sha256sum -c
      - name: Sparse files (10 GB, or the largest size that fits)
        run: |
          df -h / "$RUNNER_TEMP" | tee df.txt
          avail=$(df -BM --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc 0-9)
          BIG_MB=10240; [ $((avail - 3072)) -lt $BIG_MB ] && BIG_MB=$(( (avail - 3072) / 1024 * 1024 ))
          [ "$BIG_MB" -lt 2048 ] && { echo "disk too small: ${avail} MB"; exit 1; }
          D=$RUNNER_TEMP/bigdir; mkdir -p $D
          # big.bin = zeros, except 64 random MB at 1000 MB (below 4 GiB), 5000 MB (above) and BIG-128 MB; s1g.bin = 1 GB of zeros; both sparse
          truncate -s ${BIG_MB}M $D/big.bin; truncate -s 1024M $D/s1g.bin
          SLICES=""
          for off in 1000 5000 $((BIG_MB - 128)); do
            [ "$off" -gt $((BIG_MB - 64)) ] && continue
            timeout 60 dd if=/dev/urandom of=$D/big.bin bs=1M seek=$off count=64 conv=notrunc status=none
          done
          for off in 1000 5000 $((BIG_MB - 128)); do
            [ "$off" -gt $((BIG_MB - 64)) ] && continue
            h=$(timeout 60 dd if=$D/big.bin bs=1M skip=$off count=64 status=none | sha256sum | cut -d' ' -f1)
            SLICES="$SLICES${SLICES:+,}$off:$h"
          done
          du -h --apparent-size $D/*; du -h $D/*
          F=$(timeout 300 sha256sum $D/big.bin | cut -d' ' -f1)
          G=$(timeout 120 sha256sum $D/s1g.bin | cut -d' ' -f1)
          { echo "BIG_MB=$BIG_MB"; echo "SLICES=$SLICES"; echo "FULL_SHA=$F"; echo "S1G_SHA=$G"; echo "DIR=$D"; } >> $GITHUB_ENV
          echo "BIG_MB=$BIG_MB (wanted 10240)"
      - name: Browser run
        timeout-minutes: 40
        env:
          BROWSER: ${{ matrix.browser }}
          SW: ${{ matrix.sw }}
          FULL_BUDGET_S: ${{ github.event_name == 'workflow_dispatch' && inputs.full_budget_s || '600' }}
          OUT: ${{ runner.temp }}/big-mnt.md
        run: timeout 2300 node tests/bench/big-mnt.mjs
      - name: Job summary
        if: always()
        run: |
          { cat $RUNNER_TEMP/big-mnt.md 2>/dev/null || echo "no result"; echo; echo '```'; cat df.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-${{ matrix.browser }}-${{ matrix.sw }}
          path: ${{ runner.temp }}/big-mnt.md.rss.txt
