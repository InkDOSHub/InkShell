[package]
name = "inksoc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[features]
# Wine Tahoma bitmap font (LGPL-2.1+) for the Windows GDI; off in the terminal build
tahoma = []
prof = []
# measurement only: counts the opcodes the interpreter runs (export ophist)
ophist = []
# measurement only (item 46): run-time HOT + the region given to host_jit (exports set_jit_hot, jit_probe*)
jitprobe = []
# measurement only (item 53): time marks inside init (export init_prof)
initprof = []
# instruction-by-instruction check against a reference CPU (tools/diff)
diff = []
ab_tlb = []
ab_flush = [] # measurement only: dirty registers are written back twice at block exits # measurement only: every memory access does its TLB check twice
